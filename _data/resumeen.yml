work:
  - company: "Top Doctors Group"
    position: "DevOps Engineer / SRE"
    website: "https://topdoctorsgroup.com"
    startDate: "2026-01-07"
    endDate: ""
    summary: >
      Management, automation and maintenance of cloud infrastructure and microservices platforms across different group projects, with a focus on Kubernetes, CI/CD, observability, operational security and continuous improvement of production environments.
    highlights:
      - Management of cloud infrastructure on Google Cloud Platform and AWS using Terraform.
      - Operation of Kubernetes workloads with Helm, ingress controllers and Gateway API.
      - Maintenance of CI/CD pipelines for microservices using Cloud Build, CircleCI and Bitbucket.
      - Automation of operational tasks with Python, Bash and Go.
      - Design of dashboards and alerts in Grafana, Prometheus, Loki, Tempo and Datadog.
      - Management of secrets and application configuration using Google Secret Manager and Kubernetes Secrets.
      - Containerization and image publishing with Docker, Podman and Artifact Registry.
      - Support for production deployments, incident troubleshooting and continuous platform improvement.

  - company: "STEMDO"
    position: "DevOps Engineer / SRE"
    website: "https://stemdo.io"
    startDate: "2023-03-03"
    endDate: "2026-01-07"
    summary: >
      Participation in internal projects and services for Banco Santander, including Santander Digital Services and Santander UK. Work focused on infrastructure automation, Kubernetes platform maintenance, CI/CD pipeline development, observability, production support and continuous improvement of DevOps/SRE processes.
    highlights:
      - Design, development and maintenance of advanced CI/CD pipelines with GitHub Actions to automate build, test, analysis and application deployment processes.
      - Daily operation of Kubernetes platforms, managing deployments, configuration, troubleshooting and workload maintenance with Helm.
      - Creation and evolution of infrastructure as code with Terraform in cloud environments on Azure and AWS.
      - Development of internal automation tools with Bash, Python, JavaScript, TypeScript and PowerShell to reduce manual tasks and improve operational efficiency.
      - Implementation and maintenance of observability, monitoring and alerting solutions with Dynatrace, Grafana and related tools.
      - Participation in on-call rotations and production support, investigating incidents, reviewing metrics, logs and cluster status to ensure service continuity.
      - Development of APIs and internal solutions to automate processes and support integrations between teams and platforms.
      - Maintenance and improvement of Ansible playbooks for configuration automation and operational tasks.
      - Management of Git workflows, applying branching strategies such as Trunk-Based Development and Git Flow depending on project needs.
      - Technical coordination and task supervision in internal projects, collaborating with multidisciplinary teams under agile methodologies with Jira and GitHub Projects.

