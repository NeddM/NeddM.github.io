work:
  - company: "Top Doctors Group"
    position: "Ingeniero DevOps / SRE"
    website: "https://topdoctorsgroup.com"
    startDate: "2026-01-07"
    endDate: ""
    summary: >
      Gestión, automatización y mantenimiento de infraestructura cloud y plataformas de microservicios para distintos proyectos del grupo, con foco en Kubernetes, CI/CD, observabilidad, seguridad operativa y mejora continua de entornos productivos.
    highlights:
      - Gestión de infraestructura cloud en GCP y AWS mediante Terraform.
      - Operación de workloads en Kubernetes con Helm, ingress controllers y Gateway API.
      - Mantenimiento de pipelines CI/CD para microservicios usando Cloud Build, CircleCI y Bitbucket.
      - Automatización de tareas operativas con Python, Bash y Go.
      - Diseño de dashboards y alertas en Grafana, Prometheus, Loki, Tempo y Datadog.
      - Gestión de secretos y configuración de aplicaciones mediante Google Secret Manager y Kubernetes Secrets.
      - Contenerización y publicación de imágenes con Docker, Podman y Artifact Registry.
      - Soporte a despliegues productivos, troubleshooting de incidentes y mejora continua de la plataforma.

  - company: "STEMDO"
    position: "Ingeniero DevOps / SRE"
    website: "https://stemdo.io"
    startDate: "2023-03-03"
    endDate: "2026-01-07"
    summary: >
      Participación en proyectos internos y en servicios para Banco Santander, incluyendo Santander Digital Services y Santander UK. Trabajo centrado en la automatización de infraestructura, mantenimiento de plataformas Kubernetes, desarrollo de pipelines CI/CD, observabilidad, soporte a entornos productivos y mejora continua de procesos DevOps/SRE.
    highlights:
      - Diseño, desarrollo y mantenimiento de pipelines CI/CD avanzados con GitHub Actions para automatizar build, test, análisis y despliegue de aplicaciones.
      - Operación diaria de plataformas Kubernetes, gestionando despliegues, configuración, troubleshooting y mantenimiento de workloads mediante Helm.
      - Creación y evolución de infraestructura como código con Terraform en entornos cloud sobre Azure y AWS.
      - Desarrollo de automatizaciones y herramientas internas con Bash, Python, JavaScript, TypeScript y PowerShell para reducir tareas manuales y mejorar la eficiencia operativa.
      - Implementación y mantenimiento de soluciones de observabilidad, monitorización y alertado con Dynatrace, Grafana y herramientas asociadas.
      - Participación en guardias y soporte a entornos productivos, investigando incidencias, revisando métricas, logs y estado de clusters para garantizar la continuidad del servicio.
      - Desarrollo de APIs y soluciones internas para automatizar procesos y facilitar integraciones entre equipos y plataformas.
      - Mantenimiento y mejora de playbooks de Ansible para automatización de configuración y tareas operativas.
      - Gestión de flujos de trabajo con Git, aplicando estrategias de ramificación como Trunk-Based Development y Git Flow según las necesidades del proyecto.
      - Coordinación técnica y supervisión de tareas en proyectos internos, colaborando con equipos multidisciplinares bajo metodologías ágiles con Jira y GitHub Projects.

